<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/style.css">
        <title>générateur de tickets</title>
    </head>
    <body>
       <nav class="nav">
         <a href="submit-ticket.html" id="new-ticket-nav">Prendre un ticket</a>
         <a href="my-tickets.html" id="my-tickets-nav">Voir mes tickets</a>
         <button type="button" id="logout-btn">Se déconnecter</button>
       </nav>  
       <form> 
        <label for="title"> Titre du problème</label>
        <input id="title" type="text" placeholder="Quelle est le titre du problème"><br>
        <label for="description"> Description détaillée</label>
        <textarea id="description" rows="10" cols="30" placeholder="décrivez le problème en détail"></textarea><br>
        <label for="image-attach"> Joindre une image</label>
        <input id="image-attach" type="file" accept=".png, .jpeg, .jpg, .pdf"><br>
        <label for="priority"> Priorité</label>
        <select id="priority">
            <option value="Basse">Basse</option>
            <option value="Normale">Normale</option>
            <option value="Haute">Haute</option>
        </select>
        <button type="submit">Soumettre</button>
        <div id="error-message"></div>
        <div id="success-message"></div>
        </form>
        <script src="js/submit-ticket.js"></script>
    </body>
</html>
